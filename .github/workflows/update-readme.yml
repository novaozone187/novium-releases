name: Update Release README & Feeds

on:
  release:
    types:
      - published
      - edited
      - released
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update-readme:
    name: Sync README, Manifest & Feeds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout novium-releases
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate README.md, manifest.json & feeds/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAIT_FOR_ASSETS: '1'
        run: node scripts/update-feeds.mjs

      - name: Commit and Push Updated Feeds, Manifest & README
        run: |
          if [ -z "$(git status --porcelain README.md manifest.json feeds/ feed/)" ]; then
            echo "README.md, manifest.json, and feeds are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LATEST_TAG=$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));console.log(m.apps?.horizon?.tag || 'latest')")
          git add README.md manifest.json feeds/ feed/
          git commit -m "docs: sync feeds, manifest and README (${LATEST_TAG})"
          git push origin main
